<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ELO Sorter</title>
  <meta name="description" content="Spotify 좋아요 곡·플레이리스트를 티어 분류와 1:1 비교로 정렬하는 개인용 음악 랭킹 앱">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <!-- 애플 기기는 시스템 글꼴(SF Pro·Apple SD Gothic Neo)을 쓰고, 그 밖에서는 Pretendard로 비슷한 인상을 낸다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <!-- 테마 초기화 (FOUC 방지): React 로드 전에 data-theme 설정 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#ffffff' : '#1c1c1e');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <!-- Spotify SDK가 React보다 먼저 로드돼도 에러 안 나도록 콜백을 선점 -->
  <script>
    window.onSpotifyWebPlaybackSDKReady = function () {
      window.__spotifySdkReady = true;
      window.dispatchEvent(new Event('spotify-sdk-ready'));
    };
  </script>
  <script src="https://sdk.scdn.co/spotify-player.js" async></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
